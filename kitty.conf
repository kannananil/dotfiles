# ----------------------------
# Terminal
# ----------------------------
term xterm-256color

# ----------------------------
# Window
# ----------------------------
window_padding_width 10
background_opacity 0.95
background_blur 20

macos_option_as_alt both

enabled_layouts splits,stack

# Start size (acts like maximized feel)
initial_window_width 120c
initial_window_height 35c

# ----------------------------
# Font
# ----------------------------
font_family JetBrainsMono Nerd Font
font_size 16.0
disable_ligatures never

# ----------------------------
# Cursor
# ----------------------------
cursor_shape block
cursor_blink_interval 0

# ----------------------------
# Colors (your theme)
# ----------------------------
foreground #eaeaea
background #000000

cursor #F5E0DC
cursor_text_color #1E1D2F

# Normal
color0  #000000
color1  #d54e53
color2  #b9ca4a
color3  #e6c547
color4  #7aa6da
color5  #c397d8
color6  #70c0ba
color7  #eaeaea

# Bright
color8  #666666
color9  #ff3334
color10 #9ec400
color11 #e7c547
color12 #7aa6da
color13 #b77ee0
color14 #54ced6
color15 #ffffff

# ----------------------------
# Scrollback
# ----------------------------
scrollback_lines 10000
map ctrl+shift+f show_scrollback

# ----------------------------
# Word navigation (same as before)
# ----------------------------
map alt+left  send_text all \x1bb
map alt+right send_text all \x1bf

# ----------------------------
# Core workflow (IMPORTANT)
# ----------------------------

# Splits
# Horizontal split (left-right)
map ctrl+enter launch --location=hsplit

# Vertical split (top-bottom)
map ctrl+shift+enter launch --location=vsplit

# Maximize (zoom) / Restore
map ctrl+shift+z toggle_layout stack
map ctrl+shift+e toggle_layout splits

# Cycle panes (while maximized)
map ctrl+tab next_window
map ctrl+shift+tab previous_window

# Navigation (vim style)
map ctrl+h neighboring_window left
map ctrl+l neighboring_window right
map ctrl+k neighboring_window up
map ctrl+j neighboring_window down

# Resize
map ctrl+shift+h resize_window narrower
map ctrl+shift+l resize_window wider
map ctrl+shift+k resize_window taller
map ctrl+shift+j resize_window shorter

# Close pane
map ctrl+shift+w close_window

# Tabs
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab

# ----------------------------
# Tab bar
# ----------------------------
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 2
tab_title_template "{index}: {title}"
active_tab_foreground   #f38ba8
active_tab_background   #1e1e2e
inactive_tab_foreground #a6adc8
inactive_tab_background #181825

# ----------------------------
# URL handling
# ----------------------------
url_color #7aa6da
url_style curly
open_url_with default
detect_urls yes

# ----------------------------
# Clipboard
# ----------------------------
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard

# ----------------------------
# Remote control (scripting, e.g. `kitty @ new-window`)
# ----------------------------
allow_remote_control yes
listen_on unix:/tmp/mykitty

# ----------------------------
# Performance
# ----------------------------
repaint_delay 10
input_delay 3
sync_to_monitor yes

# ----------------------------
# Misc
# ----------------------------
enable_audio_bell no
confirm_os_window_close 0
